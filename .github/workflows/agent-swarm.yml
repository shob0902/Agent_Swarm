# Executes one Agent Swarm task on a GitHub-hosted runner. This replaces the old Celery worker + Redis broker.
#
# Triggered only by the Django API via workflow_dispatch (never by push/PR events), with a single
# non-secret input: the task id. The runner fetches the task's inputs and writes every state change
# back through the HMAC-signed runner API (/api/runner/...), so it never holds database credentials.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   AGENT_SWARM_API_URL    public base URL of the Django API, e.g. https://agent-swarm-api.onrender.com/api
#   RUNNER_SHARED_SECRET   same value as the backend's RUNNER_SHARED_SECRET
#   AGENT_GITHUB_TOKEN     token that pushes the branch and opens the PR on the *target* repo
#   GROQ_API_KEY_PLANNER, GROQ_API_KEY_CODER_A, GROQ_API_KEY_CODER_B, GROQ_API_KEY_REVIEWER
# Optional repository variables (same page -> Variables):
#   GROQ_MODEL, GROQ_REASONING_EFFORT, MAX_TEST_RETRIES, MAX_REVIEW_RETRIES, PR_ALLOW_FORKS, ALLOWED_REPO_OWNERS, PR_LABELS
name: Agent Swarm pipeline
run-name: "Agent Swarm task #${{ inputs.task_id }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Agent Swarm task id"
        required: true
        type: string

# The job only needs to read this repo's code. Everything it does to the *target* repo goes
# through AGENT_GITHUB_TOKEN, not the workflow's own GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: agent-swarm-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      # Passed through env (never interpolated into scripts) to rule out script injection.
      TASK_ID: ${{ inputs.task_id }}
      DEBUG: "False"
      DJANGO_SECRET_KEY: agent-swarm-runner-does-not-serve-http
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Validate input
        working-directory: .
        run: |
          if ! [[ "$TASK_ID" =~ ^[0-9]{1,12}$ ]]; then
            echo "::error::task_id must be a positive integer"
            exit 1
          fi

      - name: Check out Agent Swarm
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Build sandbox image
        run: docker build -t agent-swarm-sandbox:latest -f docker/sandbox.Dockerfile .

      - name: Run Analyzer -> Planner -> Coder -> Tester -> Reviewer -> Pull Request
        env:
          AGENT_SWARM_API_URL: ${{ secrets.AGENT_SWARM_API_URL }}
          RUNNER_SHARED_SECRET: ${{ secrets.RUNNER_SHARED_SECRET }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GROQ_API_KEY_PLANNER: ${{ secrets.GROQ_API_KEY_PLANNER }}
          GROQ_API_KEY_CODER_A: ${{ secrets.GROQ_API_KEY_CODER_A }}
          GROQ_API_KEY_CODER_B: ${{ secrets.GROQ_API_KEY_CODER_B }}
          GROQ_API_KEY_REVIEWER: ${{ secrets.GROQ_API_KEY_REVIEWER }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_REASONING_EFFORT: ${{ vars.GROQ_REASONING_EFFORT || 'low' }}
          MAX_TEST_RETRIES: ${{ vars.MAX_TEST_RETRIES || '3' }}
          MAX_REVIEW_RETRIES: ${{ vars.MAX_REVIEW_RETRIES || '1' }}
          PR_ALLOW_FORKS: ${{ vars.PR_ALLOW_FORKS || 'true' }}
          ALLOWED_REPO_OWNERS: ${{ vars.ALLOWED_REPO_OWNERS }}
          PR_LABELS: ${{ vars.PR_LABELS || 'agent-swarm,automated-pr' }}
        run: python manage.py run_agent_task --task-id "$TASK_ID" --remote

      # If the job crashed, timed out or was cancelled before the pipeline recorded an outcome,
      # mark the task failed so the dashboard doesn't show it as running forever.
      - name: Record unfinished run
        if: failure() || cancelled()
        env:
          AGENT_SWARM_API_URL: ${{ secrets.AGENT_SWARM_API_URL }}
          RUNNER_SHARED_SECRET: ${{ secrets.RUNNER_SHARED_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: python manage.py run_agent_task --task-id "$TASK_ID" --remote --mark-failed "GitHub Actions run ended before the pipeline finished ($JOB_STATUS)"
